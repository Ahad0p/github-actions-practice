name: CI

on:
  workflow_dispatch

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkoutcode
        uses: actions/checkout@v7
        
      - name: Setup NodeJs
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install npm packages
        run: npm install
        working-directory: frontend

      - name: run linter
        run: npm run lint
        working-directory: frontend

      - name: run tests
        run: npm run test
        working-directory: frontend
      # - Test
      # - Push

